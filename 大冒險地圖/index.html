<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#193c45"><title>三印之途：頂大之門｜大冒險地圖</title>
<script>try{if(sessionStorage.getItem('adventure_cover_seen')==='1')document.documentElement.classList.add('cover-skipped')}catch{}</script>
<link rel="preload" as="image" href="cover.png">
<style>
:root{color-scheme:light;--ink:#193c45;--paper:#fff9ea;--green:#207959}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,[role=button]:focus-visible{outline:4px solid #e38b23;outline-offset:4px}[hidden]{display:none!important}.shell{max-width:1540px;margin:auto;padding:26px 32px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:#668276}h1{font-size:clamp(26px,3vw,42px);margin:5px 0 7px;letter-spacing:2px}.subtitle{margin:0;font-size:14px;color:#63756d}.info{display:flex;gap:15px;align-items:center;flex-shrink:0}.count{font-weight:800;background:#e5efdf;border-radius:30px;padding:12px 18px}.reset,.close{background:transparent;border:1px solid #b4c2b1;border-radius:12px;padding:11px 14px;color:var(--ink)}.map-container{display:flex;justify-content:center;margin:22px auto 0}.map{position:relative;line-height:0;box-shadow:0 14px 38px #304e3926;border:3px solid var(--ink);border-radius:24px;overflow:hidden;max-width:100%}.map img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100svh - 208px);object-fit:contain}.hotspot{position:absolute;cursor:pointer;border-radius:16px;transition:background .2s,box-shadow .2s;line-height:1.4}.hotspot:hover,.hotspot:focus-visible{background:#fff8;box-shadow:0 0 22px #fff9}.hotspot.completed{box-shadow:inset 0 0 0 3px #218a59;background:#40be7920}.stamp{position:absolute;right:-9px;top:-16px;background:#207959;color:white;border:3px solid #fff9ea;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:900;font-size:23px;box-shadow:0 3px 8px #122b3930}.map-note{text-align:center;font-size:13px;color:#687e71;margin:18px 0 0}.map-note span{margin:0 12px}.storage-note{padding:12px;background:#ffe0ce;border-radius:12px;margin-top:12px}dialog{border:2px solid var(--ink);border-radius:24px;padding:28px;background:var(--paper);color:var(--ink);width:min(740px,94vw);max-height:90svh;overflow:auto;box-shadow:0 24px 100px #0005}dialog::backdrop{background:#102d37b8;backdrop-filter:blur(5px)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:16px}h2{font-size:27px;margin:8px 0}.modal-copy{color:#63756d;line-height:1.7;font-size:14px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.slot{min-height:145px;border:2px dashed #b6c5b0;border-radius:17px;background:#edf0e2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;color:var(--ink)}.slot small{font-size:12px;color:#708173}.slot.over{background:#ffebad;border-color:#ae7d13}.slot.filled{background:#d4edda;border:2px solid var(--green)}.slot.wrong{animation:wrong .45s}.bag{min-height:112px;padding:18px;border:1px solid #d7ddc9;border-radius:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}.badge{border:2px solid #ba8d2d;border-radius:14px;background:#fff0b9;color:#524013;padding:18px 12px;font-weight:800;touch-action:none;cursor:grab;box-shadow:0 4px 0 #b99c5140}.badge.selected{outline:3px solid #207959;outline-offset:3px}.badge:active{cursor:grabbing}.slot .badge{font-size:13px;padding:12px 8px;max-width:100%;cursor:default}.ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.9;transform:translate(-50%,-50%);margin:0}.message{min-height:44px;font-size:14px;line-height:1.6;color:var(--green);margin-bottom:0}.success{text-align:center;padding:30px 12px}.success .trophy{font-size:64px}.success h2{font-size:38px}.time{font-size:36px;font-variant-numeric:tabular-nums;margin:14px 0 28px;font-weight:800}.primary{background:var(--green);color:white;border:0;border-radius:13px;padding:15px 28px;font-weight:800}.success p{color:#62786c}@keyframes wrong{0%,100%{background:#edf0e2}25%,75%{background:#f9b9af;border-color:#b62b2b}50%{transform:translateX(5px)}}@media(max-width:650px){.shell{padding:18px 12px}.top{align-items:flex-start;flex-direction:column;gap:14px}.info{align-self:flex-end;font-size:13px;gap:10px}.count{padding:9px 12px}.reset{padding:9px 12px}.map-container{margin-top:18px}.map{border-radius:14px}.map img{max-height:none;width:100%}.subtitle{font-size:12px}.map-note{font-size:12px;line-height:1.8}.map-note span{display:block}.stamp{width:25px;height:25px;font-size:17px;top:-12px;right:-5px}dialog{padding:20px 14px}.slots{gap:6px}.slot{padding:8px 3px;min-height:130px;font-size:13px}.slot .badge{font-size:11px;padding:10px 3px}.badge{font-size:13px;padding:16px 10px}.modal-head h2{font-size:24px}}
.cover{position:fixed;inset:0;width:100%;height:100%;height:100dvh;z-index:10000;border:0;padding:0;margin:0;background:#102b36;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:1;transition:opacity .65s ease;touch-action:manipulation}.cover img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.cover.leaving{opacity:0;cursor:default}.cover-skipped .cover{display:none}body:has(.cover:not([hidden])){overflow:hidden}.cover:focus-visible{outline:4px solid #f6d778;outline-offset:-6px}@media(prefers-reduced-motion:reduce){.cover{transition:none}}
</style>
</head>
<body>
<button id="cover" class="cover" type="button" aria-label="三印之途：頂大之門，點擊任何部位遊戲開始"><img src="cover.png" alt="三印之途：頂大之門。點擊任何部位遊戲開始。" draggable="false" fetchpriority="high"></button>
<main class="shell" id="map-main" tabindex="-1" inert>
<header class="top"><div><div class="eyebrow">THE THREE SEALS / 三印之旅</div><h1>大冒險地圖</h1><p class="subtitle">完成 3 個關卡，拿到 3 個憑證解開大門</p></div><div class="info"><span class="count" id="count" aria-live="polite">持有 0 / 3</span><button class="reset" id="reset">🔄 清除進度</button></div></header>
<div id="storage-note" class="storage-note" role="alert" hidden>瀏覽器未允許儲存進度，請允許本機儲存後重新整理。</div>
<section class="map-container" aria-label="冒險地圖，點選地標名牌進入關卡">
<div class="map"><img src="map-bg.png" alt="Q 版冒險島：元素研究所、成語書院、勇者試煉場環繞中央臺灣大學大門" draggable="false">
<div class="hotspot" id="level-0" role="button" tabindex="0" style="left:9%;top:30%;width:20%;height:11%" aria-label="元素研究所，元素配對，未完成" title="元素配對 · 未完成"></div>
<div class="hotspot" id="level-1" role="button" tabindex="0" style="left:73%;top:30%;width:17%;height:11%" aria-label="成語書院，成語填字，未完成" title="成語填字 · 未完成"></div>
<div class="hotspot" id="level-2" role="button" tabindex="0" style="left:41%;top:80%;width:18%;height:11%" aria-label="勇者試煉場，學測打怪 RPG，未完成" title="學測打怪 RPG · 未完成"></div>
<div class="hotspot" id="gate" role="button" tabindex="0" style="left:41%;top:42%;width:18%;height:10%" aria-label="通關大門，隨時可開啟，將三印放入凹槽" title="通關大門 · 點此放入憑證"></div>
</div></section>
<p class="map-note">點選地圖上的名牌，開始你的旅程。<span>集滿三印後，前往中央的臺灣大學大門。</span></p>
</main>
<dialog id="door" aria-labelledby="door-title"><div id="puzzle"><div class="modal-head"><div><div class="eyebrow">THE FINAL GATE</div><h2 id="door-title">🔒 通關大門</h2></div><button class="close" id="close" aria-label="關閉大門">✕</button></div><p class="modal-copy">把憑證拖入對應凹槽，讓三道印記喚醒大門。<br>也可以先點憑證，再點凹槽；憑證尚未集滿也能試放。</p><div class="slots"><button class="slot" data-slot="0"><b>元素</b><small>等待元素之印</small></button><button class="slot" data-slot="1"><b>成語</b><small>等待成語之印</small></button><button class="slot" data-slot="2"><b>學測勇者</b><small>等待學測勇者之印</small></button></div><h3>冒險背包</h3><div class="bag" id="bag"></div><p class="message" id="message" aria-live="polite"></p></div><div id="success" class="success" hidden><div class="eyebrow">ALL THREE SEALS UNITED</div><h2>🏆 冒險完成！</h2><p>三印齊聚，大門為你開啟。<br>每一段探索，都成為你的力量。</p><p>總冒險時長</p><div class="time" id="time"></div><button class="primary" id="again">再次冒險</button></div></dialog>
<script>
(()=>{'use strict';
const levels=[{key:'cert_dynasty',name:'元素之印',label:'元素研究所，元素配對',url:'../示範1_元素符號及週期表配對/index.html'},{key:'cert_idiom',name:'成語之印',label:'成語書院，成語填字',url:'../示範2_成語填字/index.html'},{key:'cert_warrior',name:'學測勇者之印',label:'勇者試煉場，學測打怪 RPG',url:'../示範3_打怪RPG/index.html'}];
const $=id=>document.getElementById(id),door=$('door'),bag=$('bag'),slots=[...document.querySelectorAll('.slot')];let owned=[],placed=new Set(),selected=null,drag=null,suppress=0;
function get(key){try{return localStorage.getItem(key)}catch{$('storage-note').hidden=false;return null}}
function start(){const value=Number(get('adventure_start'));if(!Number.isFinite(value)||value<=0||value>Date.now()){try{localStorage.setItem('adventure_start',Date.now().toString())}catch{$('storage-note').hidden=false}}}
function refresh(){owned=levels.map(l=>{const v=get(l.key);return v!==null&&!['','false','0','null','undefined'].includes(v)});$('count').textContent=`持有 ${owned.filter(Boolean).length} / 3`;levels.forEach((l,i)=>{const el=$('level-'+i);el.classList.toggle('completed',owned[i]);el.setAttribute('aria-label',l.label+'，'+(owned[i]?'已完成 ✓':'未完成'));el.title=l.label+' · '+(owned[i]?'已完成 ✓':'未完成');el.replaceChildren();if(owned[i]){const seal=document.createElement('span');seal.className='stamp';seal.textContent='✓';seal.setAttribute('aria-hidden','true');el.append(seal)}})}
function message(text){$('message').textContent=text}
function select(i){selected=i;document.querySelectorAll('.badge').forEach(e=>e.classList.toggle('selected',Number(e.dataset.badge)===i));message(`已選取${levels[i].name}，請點選對應凹槽。`)}
function badge(i){const b=document.createElement('button');b.type='button';b.className='badge';b.textContent=levels[i].name;b.dataset.badge=i;b.draggable=true;b.setAttribute('aria-label',levels[i].name+'，可拖曳或點選');b.onclick=()=>{if(Date.now()>suppress)select(i)};b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||e.button!==0)return;e.preventDefault();b.setPointerCapture(e.pointerId);drag={id:e.pointerId,index:i,x:e.clientX,y:e.clientY,ghost:null};});return b}
function renderBag(){bag.replaceChildren();owned.forEach((yes,i)=>{if(yes&&!placed.has(i))bag.append(badge(i))});if(!bag.childElementCount){const p=document.createElement('span');p.className='modal-copy';p.textContent=placed.size===3?'三枚憑證已就位。':owned.some(Boolean)?'目前憑證已放入凹槽，繼續其他關卡來收集剩餘憑證。':'背包還是空的，先到地圖上的關卡收集憑證吧！';bag.append(p)}}
function openDoor(){refresh();placed.clear();selected=null;slots.forEach((s,i)=>{s.className='slot';s.replaceChildren();const b=document.createElement('b');b.textContent=['元素','成語','學測勇者'][i];const sm=document.createElement('small');sm.textContent='等待'+levels[i].name;s.append(b,sm)});$('puzzle').hidden=false;$('success').hidden=true;renderBag();message('目前持有 '+owned.filter(Boolean).length+' 枚憑證，可以隨時試放。');if(!door.open)door.showModal()}
function place(i,target){if(!Number.isInteger(i)||!owned[i]||placed.has(i))return;if(i!==target){const s=slots[target];s.classList.remove('wrong');void s.offsetWidth;s.classList.add('wrong');setTimeout(()=>s.classList.remove('wrong'),500);selected=null;renderBag();message('印記不相符！憑證已回到背包，再試一次。');return}placed.add(i);selected=null;const s=slots[i];s.className='slot filled';s.querySelector('small').remove();const b=badge(i);b.draggable=false;b.disabled=true;s.append(b);renderBag();message(levels[i].name+'已就位！');if(placed.size===3){const elapsed=Math.max(0,Math.floor((Date.now()-Number(get('adventure_start')||Date.now()))/1000));$('time').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+' 分 '+String(elapsed%60).padStart(2,'0')+' 秒';$('puzzle').hidden=true;$('success').hidden=false;$('again').focus()}}
slots.forEach((s,i)=>{s.onclick=()=>{if(selected!==null)place(selected,i);else message('請先從背包選取一枚憑證。')};s.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';s.classList.add('over')});s.addEventListener('dragleave',()=>s.classList.remove('over'));s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');const raw=e.dataTransfer.getData('text/plain');if(/^[0-2]$/.test(raw))place(Number(raw),i)})});
function cancelDrag(){drag?.ghost?.remove();drag=null;slots.forEach(s=>s.classList.remove('over'))}
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){const g=document.createElement('div');g.className='badge ghost';g.textContent=levels[drag.index].name;door.append(g);drag.ghost=g}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');slots.forEach(s=>s.classList.toggle('over',s===target))}},{passive:false});
document.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');suppress=Date.now()+500;cancelDrag();if(d.ghost){if(target)place(d.index,Number(target.dataset.slot));else message('憑證已回到背包。')}else select(d.index)});document.addEventListener('pointercancel',cancelDrag);window.addEventListener('blur',cancelDrag);door.addEventListener('close',cancelDrag);
const cover=$('cover'),mapMain=$('map-main');let coverLeaving=false,coverTimer;
function showCover(){clearTimeout(coverTimer);coverLeaving=false;document.documentElement.classList.remove('cover-skipped');cover.classList.remove('leaving');cover.hidden=false;mapMain.inert=true;cover.focus()}
function enterAdventure(){if(cover.hidden||coverLeaving)return;coverLeaving=true;try{sessionStorage.setItem('adventure_cover_seen','1')}catch{}start();cover.classList.add('leaving');const finish=()=>{clearTimeout(coverTimer);cover.hidden=true;cover.classList.remove('leaving');coverLeaving=false;mapMain.inert=false;mapMain.focus({preventScroll:true})};coverTimer=setTimeout(finish,window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:680)}
function syncCover(){let seen=false;try{seen=sessionStorage.getItem('adventure_cover_seen')==='1'}catch{}if(seen){cover.hidden=true;mapMain.inert=false;start()}else if(!coverLeaving)showCover()}
function reset(replay=false){cancelDrag();try{localStorage.clear()}catch{$('storage-note').hidden=false}if(door.open)door.close();if(replay){try{sessionStorage.clear()}catch{}showCover()}else start();refresh()}
// 觸控拖放後瀏覽器可能略過下一次相容 click，直接處理按鈕的觸控放開。
function actionButton(id,action){const el=$(id);let lastTouch=0;el.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;e.preventDefault();lastTouch=Date.now();action()});el.onclick=()=>{if(Date.now()-lastTouch>600)action()}}
levels.forEach((l,i)=>$('level-'+i).onclick=()=>location.href=l.url);$('gate').onclick=openDoor;document.querySelectorAll('[role=button]').forEach(el=>el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});actionButton('cover',enterAdventure);actionButton('close',()=>door.close());actionButton('reset',()=>reset());actionButton('again',()=>reset(true));window.addEventListener('pageshow',()=>{syncCover();refresh()});window.addEventListener('storage',()=>{refresh();if(door.open&&!$('puzzle').hidden)openDoor()});syncCover();refresh();
})();
</script>
</body></html>
